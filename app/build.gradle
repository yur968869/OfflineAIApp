plugins {
    id 'com.android.application'
}

android {
    namespace "com.offlineai"
    compileSdk 34

    defaultConfig {
        applicationId "com.offlineai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}

